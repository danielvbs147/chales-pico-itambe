<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chalés Pico do Itambé</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }

    .logo-img {
      width: 220px;
      max-width: 90vw;
    }

    .tagline {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #A8C896;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #A8C896;
      border-radius: 2px;
      margin: 20px 0 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px;
      font-weight: 400;
      transition: transform 0.15s ease, opacity 0.15s ease;
      border: 1.5px solid transparent;
    }

    .btn:active { transform: scale(0.97); opacity: 0.9; }

    .btn-whatsapp {
      background: #3D7A28;
      color: #ffffff;
      border-color: #3D7A28;
    }

    .btn-airbnb {
      background: #ffffff;
      color: #2C1F0A;
      border-color: #e0e0e0;
    }

    .btn-maps {
      background: #ffffff;
      color: #2C1F0A;
      border-color: #e0e0e0;
    }

    .btn-site {
      background: #F0EDE6;
      color: #2C1F0A;
      border-color: #A8C896;
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .btn-label {
      font-weight: 400;
      font-size: 15px;
      line-height: 1.2;
    }

    .btn-sub {
      font-size: 12px;
      font-weight: 300;
      opacity: 0.7;
    }

    .btn-whatsapp .btn-sub { opacity: 0.85; }

    .section-label {
      font-size: 11px;
      font-weight: 300;
      color: #A8C896;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
      margin-top: 8px;
    }

    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: #cccccc;
      font-weight: 300;
      text-align: center;
    }
  </style>
</head>
